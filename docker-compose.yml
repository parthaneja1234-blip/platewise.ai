version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: platewise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in .env}
      POSTGRES_DB: ${POSTGRES_DB:-platewise_db}

    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-platewise} -d $${POSTGRES_DB:-platewise_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platewise-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: platewise-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-platewise}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platewise_db}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platewise-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: platewise-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - platewise-net

volumes:
  pgdata:
    driver: local

networks:
  platewise-net:
    driver: bridge
